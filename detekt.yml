# Deltas from detekt's bundled defaults (buildUponDefaultConfig = true). Relaxations apply to test sources only.

build:
  maxIssues: 0

formatting:
  active: true
  NoWildcardImports:
    active: true

complexity:
  LongParameterList:
    excludes: ['**/test/**', '**/liveTest/**']
  LongMethod:
    excludes: ['**/test/**', '**/liveTest/**']
  TooManyFunctions:
    excludes: ['**/test/**', '**/liveTest/**']

style:
  MagicNumber:
    excludes: ['**/test/**', '**/liveTest/**']
